name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# The Supabase CLI pulls the local stack's images from public.ecr.aws by
# default, whose anonymous data limit the shared GitHub runner IPs exhaust
# ("toomanyrequests: Data limit exceeded", 2026-10-21). Supabase mirrors the
# same tags to GHCR, but GHCR throttled both anonymous and authenticated pulls
# from the runners with "toomanyrequests" (2026-10-22, even after login). CI
# therefore pulls from Docker Hub with a free authenticated account (documented
# limit: 200 pulls / 6 h per account, versus 100 / 6 h per IPv4 anonymously).
# The credentials come from the repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN and are written under the key `docker.io` because the CLI
# looks them up by the literal registry string; `docker login` would store
# `https://index.docker.io/v1/`, which it does not find. Without the secrets
# (for example fork PRs) pulls stay anonymous and rely on the retry of
# `supabase start` with backoff (SUPABASE_START_RETRIES, handled by
# scripts/supabase.sh). See docs/workflows/development-workflow.md, "Local
# Tooling".
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
  SUPABASE_START_RETRIES: 4

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Docker Hub pulls
        # An optimization, not a gate: missing secrets or a failed write must
        # not fail CI; pulls then stay anonymous.
        continue-on-error: true
        uses: ./.github/actions/docker-registry-auth
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tooling/supabase/package-lock.json

      - name: Install dependencies
        run: ./scripts/bootstrap.sh

      - name: Verify repository gate
        run: ./scripts/verify.sh --skip-backend-write-contracts

  # Compile gate only. A web-only break reached main during the arch-spine
  # slice (276a052, Platform.environment needing a kIsWeb guard) and was caught
  # by review rather than CI, because no job built the web target. The web
  # offline/IndexedDB e2e suite stays deferred; see
  # docs/deferred/2026-06-29-web-offline-e2e.md.
  web_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/lyron_app

      - name: Build web
        run: flutter build web --release
        working-directory: apps/lyron_app

  backend_write_contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Docker Hub pulls
        # An optimization, not a gate: missing secrets or a failed write must
        # not fail CI; pulls then stay anonymous.
        continue-on-error: true
        uses: ./.github/actions/docker-registry-auth
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tooling/supabase/package-lock.json

      - name: Install Supabase tooling dependencies
        run: npm ci --prefix tooling/supabase

      - name: Run backend write contracts
        run: ./scripts/backend-write-contracts.sh

  migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Docker Hub pulls
        # An optimization, not a gate: missing secrets or a failed write must
        # not fail CI; pulls then stay anonymous.
        continue-on-error: true
        uses: ./.github/actions/docker-registry-auth
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tooling/supabase/package-lock.json

      - name: Install Supabase tooling dependencies
        run: npm ci --prefix tooling/supabase

      - name: Migration lint
        run: ./scripts/check-migrations.sh
